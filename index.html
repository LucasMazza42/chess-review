<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%9F%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<style>
:root{
  --bg:#312e2b; --panel:#262522; --panel2:#21201d; --line:#3c3a37; --text:#e8e6e3; --muted:#9e9b98;
  --light:#ebecd0; --dark:#739552; --green:#81b64c; --green-d:#45753c;
  --brilliant:#26c2a3; --great:#749bbf; --best:#81b64c; --excellent:#81b64c; --good:#95b776;
  --book:#d5a47d; --inaccuracy:#f7c631; --mistake:#ffa459; --miss:#ff7769; --blunder:#fa412d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel2);border-bottom:1px solid #000;flex-wrap:wrap}
header .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
header .logo span.pawn{font-size:24px;color:var(--green)}
header .sub{color:var(--muted);font-size:12px}
header .spacer{flex:1}
.wrap{display:flex;gap:18px;padding:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
/* board column */
.boardcol{display:flex;gap:8px}
.evalbar{width:28px;border-radius:3px;overflow:hidden;position:relative;background:#403d39;display:flex;flex-direction:column}
.evalbar .fill-b{background:#403d39;transition:height .35s}
.evalbar .fill-w{background:#fff;flex:1}
.evalbar .lbl{position:absolute;left:0;right:0;text-align:center;font-size:11px;font-weight:700}
.evalbar .lbl.top{top:4px;color:#fff}.evalbar .lbl.bot{bottom:4px;color:#403d39}
.evalbar.flipped{flex-direction:column-reverse}
.boardstack{display:flex;flex-direction:column;gap:6px}
.pbar{display:flex;align-items:center;gap:10px;height:34px}
.pbar .av{width:30px;height:30px;border-radius:3px;background:#555;display:flex;align-items:center;justify-content:center;font-size:18px}
.pbar .av.w{background:#f0f0f0;color:#333}.pbar .av.b{background:#333;color:#eee;border:1px solid #555}
.pbar .nm{font-weight:700}.pbar .rt{color:var(--muted)}
.pbar .clk{margin-left:auto;background:#1e1d1b;padding:3px 10px;border-radius:3px;font-variant-numeric:tabular-nums;font-weight:700;min-width:70px;text-align:right}
.pbar .clk:empty{display:none}
#board{--sz:min(78vh,calc(100vw - 520px),680px);width:var(--sz);height:var(--sz);min-width:300px;min-height:300px;position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:3px;overflow:hidden;user-select:none}
@media (max-width:1000px){#board{--sz:min(92vw,560px)}}
.sq{position:relative}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.hl::before{content:"";position:absolute;inset:0;background:rgba(255,255,51,.5)}
.sq.hl.cls::before{background:var(--hlc)}
.sq img,.sq .glyph{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.sq .glyph{display:flex;align-items:center;justify-content:center;font-size:calc(var(--sz)/10)}
.sq .co{position:absolute;font-size:calc(var(--sz)/52);font-weight:700;z-index:1}
.sq .co.r{left:3px;top:1px}.sq .co.f{right:3px;bottom:0}
.sq.l .co{color:var(--dark)}.sq.d .co{color:var(--light)}
.badge{position:absolute;right:-10%;top:-10%;width:42%;height:42%;z-index:5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(var(--sz)/40);box-shadow:0 1px 3px rgba(0,0,0,.5);border:2px solid #fff}
.sq.edge-r .badge{right:2%}.sq.edge-t .badge{top:2%}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
/* side panel */
.side{width:430px;max-width:100%;background:var(--panel);border-radius:6px;display:flex;flex-direction:column;max-height:calc(78vh + 90px);min-height:560px;overflow:hidden}
.tabs{display:flex;background:var(--panel2)}
.tabs button{flex:1;padding:12px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--green)}
.pane{display:none;flex:1;overflow:auto;padding:14px}
.pane.on{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
input[type=text],select,textarea{background:#1e1d1b;border:1px solid var(--line);border-radius:4px;padding:8px 10px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--green)}
textarea{width:100%;min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.btn{background:#3c3a37;border:0;border-radius:5px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{background:#4a4845}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.btn.primary:hover{background:#95c95f}
.btn:disabled{opacity:.5;cursor:default}
.monthnav{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.monthnav b{color:var(--text)}
.games{display:flex;flex-direction:column;gap:2px}
.g{display:grid;grid-template-columns:18px 1fr auto 42px;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:4px;cursor:pointer}
.g:hover{background:#34322f}
.g .dot{width:12px;height:12px;border-radius:2px;border:1px solid #888}
.g .dot.w{background:#fff}.g .dot.b{background:#222}
.g .opp{font-weight:700}.g .meta{color:var(--muted);font-size:12px}
.g .res{text-align:center;font-weight:800;border-radius:3px;padding:2px 0}
.res.win{background:var(--green);color:#fff}.res.loss{background:#c33;color:#fff}.res.draw{background:#777;color:#fff}
.g .tc{text-align:right;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}.small{font-size:12px}
.err{color:#ff8a7a}
details summary{cursor:pointer;color:var(--muted);font-weight:700}
/* review */
.progress{background:#1e1d1b;border-radius:4px;height:10px;overflow:hidden}
.progress>div{height:100%;background:var(--green);width:0;transition:width .2s}
.coach{display:flex;gap:10px;background:var(--panel2);border-radius:6px;padding:12px;min-height:84px}
.coach .ic{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:16px}
.coach .t{font-size:15px}.coach .t b{font-weight:800}
.coach .ev{margin-left:auto;align-self:flex-start;background:#fff;color:#222;font-weight:800;padding:2px 7px;border-radius:3px;font-size:12px;white-space:nowrap}
.coach .ev.neg{background:#403d39;color:#fff}
.line{font-size:12px;color:var(--muted);margin-top:4px}
.line .mv{color:var(--text)}
.sumtbl{width:100%;border-collapse:collapse}
.sumtbl td{padding:3px 4px}
.sumtbl td.c{text-align:center;font-weight:800;width:70px}
.sumtbl tr.acc td{padding:8px 4px}
.accbox{display:inline-block;background:#fff;color:#222;border-radius:5px;padding:6px 10px;font-size:20px;font-weight:900;min-width:64px}
.accbox.b{background:#403d39;color:#fff}
.lab{display:flex;align-items:center;gap:8px}
.ico{width:20px;height:20px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900}
.graph{background:var(--panel2);border-radius:4px;cursor:pointer;display:block;width:100%;height:90px}
.moves{display:grid;grid-template-columns:40px 1fr 1fr;gap:2px 4px;font-size:14px}
.moves .n{color:var(--muted);padding:3px 0;text-align:right;padding-right:6px}
.moves .m{padding:3px 6px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:5px}
.moves .m:hover{background:#3c3a37}
.moves .m.cur{background:#4b4847;font-weight:800}
.moves .m .ico{width:16px;height:16px;font-size:9px}
.navbtns{display:flex;gap:6px}
.navbtns .btn{flex:1;font-size:18px;padding:6px}
.opening{font-weight:700;color:var(--book)}
.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:12px}
.settings label{display:flex;gap:5px;align-items:center}
.hidden{display:none!important}
#pane-review{overflow:hidden}
#reviewBody{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.scroller{flex:1;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.graph{background:#5a5753}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.chip{display:inline-block;padding:1px 6px;border-radius:3px;background:#3c3a37;font-size:11px;color:var(--muted)}
/* explore / try alternatives */
#board{touch-action:none}
#board.canplay{cursor:pointer}
.sq.sel{box-shadow:inset 0 0 0 3px #f7c631;z-index:3}
.sq .dot{position:absolute;width:28%;height:28%;left:36%;top:36%;border-radius:50%;background:rgba(0,0,0,.28);z-index:3;pointer-events:none}
.sq.d .dot{background:rgba(0,0,0,.38)}
.sq .dot.cap{width:92%;height:92%;left:4%;top:4%;background:transparent;box-shadow:inset 0 0 0 5px rgba(0,0,0,.28);border-radius:50%}
#ghost{position:fixed;pointer-events:none;z-index:40;transform:translate(-50%,-55%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.promo{position:absolute;left:0;right:0;top:0;z-index:8;display:flex;flex-direction:column;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.55)}
.promo.up{top:auto;bottom:0}
.promo img{width:100%;aspect-ratio:1;object-fit:contain;background:#f3f3f3;cursor:pointer}
.promo img:hover{background:#b6e08a}
.explorebar{background:#1e1d1b;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.explorebar .cmp{font-size:13px;line-height:1.35}
.enginelines{display:flex;flex-direction:column;gap:2px}
.enginelines .ln{display:flex;gap:8px;align-items:baseline;font-size:12px}
.enginelines .evn{font-weight:800;min-width:52px;font-variant-numeric:tabular-nums}
.moves{display:flex;flex-direction:column;gap:2px}
.moves .mrow{display:grid;grid-template-columns:40px 1fr 1fr;gap:2px 4px}
.moves .var{margin:2px 0 4px 28px;padding:4px 6px 4px 8px;background:#1e1d1b;border-left:3px solid var(--green);border-radius:3px;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
.moves .var .tag{color:var(--green);font-size:11px;font-weight:800;margin-right:4px}
/* daily puzzles */
.modes{display:flex;background:#1a1917;border-radius:8px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;color:var(--muted);font-weight:800;padding:7px 12px;border-radius:6px;cursor:pointer}
.modes button.on{background:var(--green);color:#fff}
.pzhead{display:flex;flex-direction:column;gap:4px}
.pzdate{font-weight:800;font-size:16px}
.pzstats{display:flex;gap:8px;flex-wrap:wrap}
.pzchip{background:#1e1d1b;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.levels{display:flex;gap:6px}
.levels button{flex:1}
.levels button.on{background:var(--green);color:#fff}
.pzcard{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border-radius:6px;padding:10px 12px;cursor:pointer}
.pzcard:hover{background:#34322f}
.pzcard .st{font-size:12px;font-weight:800}
.pzcard .st.solved{color:var(--green)}
.pzcard .st.failed{color:#ff8a7a}
.pzstat{background:var(--panel2);border-radius:6px;padding:12px}
.pzstat.good{box-shadow:inset 0 0 0 1px var(--green)}
.pzstat.bad{box-shadow:inset 0 0 0 1px var(--blunder)}
.pzmeta{margin-top:6px;color:var(--book);font-weight:700}
.sq.hintfrom::after{content:"";position:absolute;inset:0;background:rgba(129,182,76,.5);z-index:1;pointer-events:none}
.sq.bad::after{content:"";position:absolute;inset:0;background:rgba(250,65,45,.45);z-index:1;pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="pawn">♟</span> Game Review</div>
  <nav class="modes" id="modes">
    <button type="button" data-mode="review" class="on">Game Review</button>
    <button type="button" data-mode="puzzles">Daily Puzzles</button>
  </nav>
  <div class="sub" id="headSub">Chess.com games · Stockfish 18 in your browser</div>
  <div class="spacer"></div>
  <div class="settings" id="reviewSettings">
    <label>Depth <select id="depth"><option>12</option><option>14</option><option selected>16</option><option>18</option><option>20</option><option>22</option></select></label>
    <label><input type="checkbox" id="optArrow" checked> Best-move arrows</label>
    <label><input type="checkbox" id="optEngine"> Engine arrow (current)</label>
  </div>
</header>

<div class="wrap">
  <div class="boardcol">
    <div class="evalbar" id="evalbar"><div class="fill-b" id="evalB" style="height:50%"></div><div class="fill-w"></div><div class="lbl top" id="evalTop"></div><div class="lbl bot" id="evalBot"></div></div>
    <div class="boardstack">
      <div class="pbar" id="pTop"></div>
      <div id="board"></div>
      <div class="pbar" id="pBot"></div>
    </div>
  </div>

  <div class="side" id="sideReview">
    <div class="tabs"><button data-tab="games" class="on" id="tabGames">Games</button><button data-tab="review" id="tabReview">Review</button></div>

    <div class="pane on" id="pane-games">
      <div class="row">
        <input type="text" id="username" value="LucasMazza" placeholder="Chess.com username" style="flex:1">
        <button class="btn primary" id="loadUser">Load games</button>
      </div>
      <div class="monthnav"><button class="btn" id="prevMonth">‹</button><b id="monthLabel">—</b><button class="btn" id="nextMonth">›</button></div>
      <div id="gamesStatus" class="muted small"></div>
      <div class="games" id="gamesList"></div>
      <details>
        <summary>Paste a PGN instead</summary>
        <div style="margin-top:8px"><textarea id="pgnInput" placeholder="[Event ...]&#10;1. e4 e5 2. Nf3 ..."></textarea>
        <div class="row" style="margin-top:6px"><button class="btn primary" id="loadPgn">Review PGN</button><span id="pgnErr" class="err small"></span></div></div>
      </details>
    </div>

    <div class="pane" id="pane-review">
      <div id="noGame" class="empty">Pick a game from the <b>Games</b> tab or paste a PGN to start a review.</div>
      <div id="reviewBody" class="hidden">
        <div>
          <div class="row" style="justify-content:space-between"><div class="opening" id="openingName"></div><span class="chip" id="gameMeta"></span></div>
          <div id="progWrap" style="margin-top:8px">
            <div class="row small muted" style="justify-content:space-between"><span id="progText">Analyzing…</span><span id="progPct"></span></div>
            <div class="progress"><div id="progBar"></div></div>
          </div>
        </div>
        <div class="coach" id="coach"></div>
        <svg class="graph" id="graph" viewBox="0 0 400 90" preserveAspectRatio="none"></svg>
        <div id="exploreBar" class="explorebar hidden">
          <div class="row" style="flex-wrap:wrap;justify-content:space-between">
            <span class="chip" id="exploreHint">Drag or click pieces to try a move</span>
            <label class="small" style="display:flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" id="optVsEngine"> Play vs engine</label>
          </div>
          <div id="exploreCompare" class="cmp" aria-live="polite"></div>
          <div id="engineLines" class="enginelines"></div>
          <div class="row">
            <button class="btn" id="bUndo" disabled>Undo</button>
            <button class="btn" id="bBackGame" disabled>Back to game</button>
          </div>
        </div>
        <div class="navbtns"><button class="btn" id="bStart" title="Start (↑)">⏮</button><button class="btn" id="bPrev" title="Previous (←)">◀</button><button class="btn" id="bNext" title="Next (→)">▶</button><button class="btn" id="bEnd" title="End (↓)">⏭</button><button class="btn" id="bFlip" title="Flip (f)">⇅</button></div>
        <div class="scroller" id="scroller"><div id="summary"></div><div class="moves" id="moves"></div></div>
      </div>
    </div>
  </div>
  <div class="side hidden" id="sidePuzzle">
    <div class="tabs"><button type="button" class="on">Daily Puzzles</button></div>
    <div class="pane on" id="puzzleBody"></div>
  </div>
</div>

<script>
'use strict';
/* ================= constants ================= */
const SF_VER = '18.0.8';
const SF_JS = `https://unpkg.com/stockfish@${SF_VER}/bin/stockfish-18-lite-single.js`;
const SF_WASM = `https://unpkg.com/stockfish@${SF_VER}/bin/stockfish-18-lite-single.wasm`;
const PIECE_URL = p => `https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/${p}.svg`;
const OPENINGS_URL = l => `https://cdn.jsdelivr.net/gh/lichess-org/chess-openings@master/${l}.tsv`;
const CACHE_VER = 'cr2';
const MAX_MS = 5000;   // per-position time cap so one hard position can't stall the review
const EXPLORE_MS = 2800; // interactive cap for try-a-move searches
const GLYPH = {wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};
const CLS = {
  brilliant:  {name:'Brilliant',  sym:'!!', color:'var(--brilliant)'},
  great:      {name:'Great',      sym:'!',  color:'var(--great)'},
  best:       {name:'Best',       sym:'★',  color:'var(--best)'},
  excellent:  {name:'Excellent',  sym:'👍', color:'var(--excellent)'},
  good:       {name:'Good',       sym:'✓',  color:'var(--good)'},
  book:       {name:'Book',       sym:'📖', color:'var(--book)'},
  inaccuracy: {name:'Inaccuracy', sym:'?!', color:'var(--inaccuracy)'},
  mistake:    {name:'Mistake',    sym:'?',  color:'var(--mistake)'},
  miss:       {name:'Miss',       sym:'✗',  color:'var(--miss)'},
  blunder:    {name:'Blunder',    sym:'??', color:'var(--blunder)'},
};
const CLS_ORDER = ['brilliant','great','best','excellent','good','book','inaccuracy','mistake','miss','blunder'];
const HL = {brilliant:'rgba(38,194,163,.5)',great:'rgba(116,155,191,.55)',best:'rgba(129,182,76,.5)',excellent:'rgba(129,182,76,.45)',good:'rgba(149,183,118,.45)',book:'rgba(213,164,125,.5)',inaccuracy:'rgba(247,198,49,.5)',mistake:'rgba(255,164,89,.55)',miss:'rgba(255,119,105,.55)',blunder:'rgba(250,65,45,.55)'};
const VAL = {p:1,n:3,b:3,r:5,q:9,k:0};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

/* ================= win% & accuracy (Lichess formulas) ================= */
function winWhite(ev){                       // ev is white-POV {cp, mate, winner}
  if (!ev) return 50;
  if (ev.mate != null) return ev.mate > 0 ? 100 : ev.mate < 0 ? 0 : (ev.winner === 'w' ? 100 : 0);
  const cp = clamp(ev.cp, -1000, 1000);
  return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
}
const winFor = (color, ev) => color === 'w' ? winWhite(ev) : 100 - winWhite(ev);
function moveAccuracy(before, after){        // win% from mover POV
  if (after >= before) return 100;
  const d = before - after;
  return clamp(103.1668100711649 * Math.exp(-0.04354415386753951 * d) - 3.166924740191411 + 1, 0, 100);
}
function stdev(a){ const m = a.reduce((s,x)=>s+x,0)/a.length; return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length); }
function gameAccuracy(evals, moves){         // Lichess: volatility-weighted mean + harmonic mean
  const wins = evals.map(winWhite);
  const n = moves.length; if (!n) return {w:null,b:null};
  const ws = clamp(Math.floor(n/10), 2, 8);
  const windows = [];
  for (let i = 0; i < Math.min(ws-2, n); i++) windows.push(wins.slice(0, ws));
  for (let i = 0; i + ws <= wins.length && windows.length < n; i++) windows.push(wins.slice(i, i+ws));
  while (windows.length < n) windows.push(wins.slice(-ws));
  const weights = windows.map(w => clamp(stdev(w), 0.5, 12));
  const res = {};
  for (const c of ['w','b']){
    let ws_ = 0, wsum = 0, hs = 0, cnt = 0;
    moves.forEach((m,i) => { if (m.color !== c) return;
      ws_ += m.acc * weights[i]; wsum += weights[i]; hs += 1/Math.max(m.acc, 0.5); cnt++; });
    res[c] = cnt ? ((ws_/wsum) + (cnt/hs)) / 2 : null;
  }
  return res;
}

/* ================= Stockfish (blob worker wrapper, single-threaded WASM) ================= */
class Engine {
  constructor(){ this.ready = null; this.listeners = []; this._tail = Promise.resolve(); this._mpv = 2; }
  init(){
    if (this.ready) return this.ready;
    this.ready = (async () => {

let BOOK = null;

async function loadBook(){
  if (BOOK) return BOOK;
  try { const c = localStorage.getItem('cr-book-v2'); if (c) { BOOK = new Map(JSON.parse(c)); return BOOK; } } catch(e){}
  const map = new Map();
  try {
    const txts = await Promise.all(['a','b','c','d','e'].map(l => fetch(OPENINGS_URL(l)).then(r => r.ok ? r.text() : '')));
    const ch = new Chess();
    for (const txt of txts) for (const row of txt.split('\n').slice(1)) {
      const [eco, name, pgn] = row.split('\t'); if (!pgn) continue;
      ch.reset();
      const toks = pgn.replace(/\d+\.(\.\.)?/g,' ').trim().split(/\s+/);
      const seen = [];
      for (const s of toks) { if (!ch.move(s, {sloppy:true})) break; seen.push(epd(ch.fen())); }
      seen.forEach((k, j) => {
        const exact = j === seen.length - 1, prev = map.get(k);
        // exact line names win over names inherited by intermediate positions
        if (!prev || (exact && !prev[2]) || (exact === !!prev[2] && prev[1].length > name.length)) map.set(k, [eco, name, exact ? 1 : 0]);
      });
    }
    BOOK = map;
    try { localStorage.setItem('cr-book-v2', JSON.stringify([...map])); } catch(e){}
  } catch(e){ console.warn('opening book unavailable', e); BOOK = map; }
  return BOOK;
}

function arrow(uci, color, op=0.85){
  if (!uci || uci.length < 4 || uci === '(none)') return '';

  const px = -uy, py = ux;
  const pts = [[ax+px*w/2,ay+py*w/2],[ex+px*w/2,ey+py*w/2],[ex+px*w*1.6,ey+py*w*1.6],[bx,by],[ex-px*w*1.6,ey-py*w*1.6],[ex-px*w/2,ey-py*w/2],[ax-px*w/2,ay-py*w/2]];
  return `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${color}" opacity="${op}"/>`;
}

/* ================= Classification ================= */
function hangingSacrifice(fenBefore, m){
  // Did the mover leave material (>= minor piece) en prise without getting enough back right now?
  const ch = new Chess(fenBefore);
  const mv = ch.move({from:m.from, to:m.to, promotion:m.promotion});
  if (!mv) return false;
  const gained = mv.captured ? VAL[mv.captured] : 0;
  if (ch.in_checkmate()) return false;
  let worst = 0;
  for (const r of ch.moves({verbose:true})) {
    if (!r.captured || VAL[r.captured] < 3) continue;
    const ch2 = new Chess(ch.fen()); ch2.move(r);
    const recapture = ch2.moves({verbose:true}).some(x => x.to === r.to);
    const net = VAL[r.captured] - (recapture ? VAL[r.piece] : 0);
    worst = Math.max(worst, net);
  }
  return worst - gained >= 2;
}
// Shared by the full-game review and by try-a-move. Writes loss/acc/cls onto m.
// Returns a book hit (or null). Does not rename the game opening — the caller does.
function classifyOne(m, before, after, fenBefore, ctx){
  const wb = winFor(m.color, before), wa = winFor(m.color, after);
  m.loss = Math.max(0, wb - wa);
  m.acc = moveAccuracy(wb, wa);
  m.opening = null;
  const bookHit = ctx.isStd && BOOK && ctx.plyIndex < 30 && BOOK.get(epd(ctx.fenAfter));
  if (bookHit) { m.cls = 'book'; return bookHit; }
  const isBest = before.best === m.uci;
  const l2 = before.second;
  let cls;
  if (isBest || m.loss < 0.01 && before.best == null) cls = 'best';
  else if (m.loss < 2) cls = 'excellent';
  else if (m.loss < 5) cls = 'good';
  else if (m.loss < 10) cls = 'inaccuracy';
  else if (m.loss < 20) cls = 'mistake';
  else cls = 'blunder';
  if (cls === 'best' || cls === 'excellent') {
    const prevM = ctx.prev;
    const recapture = prevM && prevM.captured && prevM.to === m.to;
    if (m.loss < 2 && wb < 97 && wa >= 50 && !recapture && hangingSacrifice(fenBefore, m)) cls = 'brilliant';
    else if (isBest && l2 && !recapture && ctx.legal > 1) {
      const gap = wb - winFor(m.color, l2);
      if (gap >= 20 && wa >= 40 && wb < 97) cls = 'great';
    }
  }
  if ((cls === 'mistake' || cls === 'blunder' || cls === 'inaccuracy') && ctx.prev && ctx.prev.cls) {
    const p = ctx.prev;
    if (['mistake','blunder','miss'].includes(p.cls) && wb >= 60 && wa >= 30 && m.loss >= 10) cls = 'miss';
  }
  m.cls = cls;
  return null;
}
function classify(g){
  const ms = g.moves, ev = g.evals;
  g.opening = ecoUrlName(g.headers.ECOUrl);
  ms.forEach((m, i) => {
    const bookHit = classifyOne(m, ev[i], ev[i+1], g.fens[i], {
      prev: i > 0 ? ms[i-1] : null, plyIndex: i, isStd: g.isStd, fenAfter: g.fens[i+1], legal: g.legal[i],
    });
    if (bookHit) {
      if (bookHit[2]) { g.opening = bookHit[1]; g.eco = bookHit[0]; }   // only exact database lines rename the opening
      m.opening = g.opening;
    }
  });
  g.accuracy = gameAccuracy(ev, ms);
}

/* ================= Game loading ================= */
function parseClocks(pgn){
  const c = [...pgn.matchAll(/\[%clk\s+(\d+):(\d+):(\d+(?:\.\d+)?)\]/g)].map(x => +x[1]*3600 + +x[2]*60 + +x[3]);
  return c.length ? c : null;
}
function buildGame(pgn, meta){
  const ch = new Chess();
  const clean = pgn.replace(/\r/g,'');
  if (!ch.load_pgn(clean, {sloppy:true})) throw new Error('Could not parse that PGN.');
  const headers = ch.header();
  const hist = ch.history({verbose:true});
  const start = headers.FEN || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const re = new Chess(start), fens = [re.fen()], legal = [re.moves().length], moves = [];
  for (const h of hist) {
    const m = re.move(h); fens.push(re.fen()); legal.push(re.moves().length);
    moves.push({san:m.san, from:m.from, to:m.to, promotion:m.promotion, captured:m.captured, color:m.color, uci:m.from+m.to+(m.promotion||'')});
  }
  if (!moves.length) throw new Error('That game has no moves.');
  let clocks = parseClocks(clean); if (clocks && clocks.length !== moves.length) clocks = null;
  const tc = (headers.TimeControl || '').split('+')[0];
  const id = meta && meta.url ? meta.url : 'pgn:' + hash(fens.join('|'));
  return { headers, fens, legal, moves, clocks, startClock: /^\d+$/.test(tc) ? +tc : null, id, meta,
    startMoveNo: +start.split(' ')[5] || 1, isStd: !headers.FEN && !(headers.Variant && !/standard/i.test(headers.Variant)),
    opening: ecoUrlName(headers.ECOUrl), chessComAcc: meta && meta.accuracies || null };
}
function ecoUrlName(u){ if (!u) return null; const s = decodeURIComponent(u.split('/openings/')[1] || ''); if (!s) return null;
  return s.replace(/-/g,' ').replace(/\s+\d+\.{1,3}.*$/,'').replace(/\s+/g,' ').trim(); }
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36); }

function terminalEval(fen){
  const ch = new Chess(fen);
  if (ch.in_checkmate()) return {cp:null, mate:0, winner: ch.turn() === 'w' ? 'b' : 'w', best:null, pv:[]};
  if (ch.in_stalemate() || ch.insufficient_material()) return {cp:0, mate:null, best:null, pv:[]};
  return null;
}

async function startReview(game, preferColor){
  const gen = ++S.gen;
  exploreJob++;
  S.explore = null; S.sel = null; S.promo = null; hideGhost();
  engine.stop();
  S.game = game; S.ply = 0;
  S.flipped = preferColor === 'b';
  switchTab('review');
  $('noGame').classList.add('hidden'); $('reviewBody').classList.remove('hidden');
  const h = game.headers;
  $('openingName').textContent = game.opening || 'Unknown opening';
  $('gameMeta').textContent = [h.Result, h.TimeControl ? tcLabel(h.TimeControl) : '', h.Date && h.Date !== '????.??.??' ? h.Date.replace(/\./g,'-') : ''].filter(Boolean).join(' · ');
  $('progWrap').classList.remove('hidden');
  document.body.dataset.reviewDone = '';
  renderAll();

  const depth = +$('depth').value;
  const key = `${CACHE_VER}:${game.id}:${depth}`;
  let cached = null; try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){}
  await loadBook();
  if (gen !== S.gen) return;
  const total = game.fens.length;
  game.evals = new Array(total).fill(null);
  if (cached && cached.length === total) {
    game.evals = cached;
    setProgress(total, total, 'Loaded cached analysis');
  } else {
    setProgress(0, total, 'Loading Stockfish…');
    try { await engine.init(); } catch(e) { setProgress(0, total, 'Engine failed: ' + e.message, true); console.error(e); return; }
    if (gen !== S.gen) return;
    await engine.newGame();
    const t0 = performance.now();
    for (let i = 0; i < total; i++) {
      if (gen !== S.gen) return;
      let ev = terminalEval(game.fens[i]);
      if (!ev) {
        const r = await engine.analyse(game.fens[i], depth, {multipv: 2});
        if (gen !== S.gen) return;
        const l1 = r.lines[1] || {ev:{cp:0, mate:null}, pv:[]};
        ev = {...l1.ev, best: r.best && r.best !== '(none)' ? r.best : (l1.pv[0] || null), pv: l1.pv.slice(0, 12)};
        if (r.lines[2]) ev.second = r.lines[2].ev;
      }
      game.evals[i] = ev;
      const el = (performance.now() - t0) / 1000;
      setProgress(i+1, total, `Analyzing move ${Math.ceil(i/2)} of ${Math.ceil((total-1)/2)} · depth ${depth}` + (i > 3 ? ` · ~${Math.round(el/(i+1)*(total-i-1))}s left` : ''));
      if (i % 4 === 0) { renderGraph(); renderEvalBar(); }
    }
    try { localStorage.setItem(key, JSON.stringify(game.evals)); } catch(e){ pruneCache(); }
  }
  classify(game);
  game.done = true;
  $('openingName').textContent = game.opening || 'Unknown opening';
  setProgress(total, total, 'Analysis complete');
  setTimeout(() => { if (gen === S.gen) $('progWrap').classList.add('hidden'); }, 600);
  renderAll();
  document.body.dataset.reviewDone = '1';
}
function pruneCache(){ try { Object.keys(localStorage).filter(k => k.startsWith(CACHE_VER+':')).slice(0, 20).forEach(k => localStorage.removeItem(k)); } catch(e){} }
function setProgress(i, n, text, err){
  $('progBar').style.width = (n ? i/n*100 : 0) + '%';
  $('progText').textContent = text; $('progText').classList.toggle('err', !!err);
  $('progPct').textContent = n ? Math.round(i/n*100) + '%' : '';
}

async function api(url){

function tcLabel(tc){
  if (!tc || tc === '-') return '';
  if (tc.includes('/')) { const d = +tc.split('/')[1]; return Math.round(d/86400) + ' day' + (d >= 172800 ? 's' : ''); }
  const [b, inc] = tc.split('+').map(Number); const m = b >= 60 ? (b/60) + ' min' : b + 's';
  return inc ? `${b>=60?b/60:b+'s'} | ${inc}` : m;
}
const TC_ICON = {bullet:'⁍', blitz:'⚡', rapid:'⏱', daily:'☀', classical:'♜'};

function hideGhost(){ const g = $('ghost'); if (g) g.remove(); S.drag = null; }
function showGhost(piece, x, y){

function cloneEval(ev){
  if (!ev) return null;
  const c = {...ev};
  if (ev.pv) c.pv = ev.pv.slice();
  if (ev.second) c.second = {...ev.second};
  return c;
}
function linesOf(ev){
  if (!ev) return null;
  if (ev.lines && Object.keys(ev.lines).length) return ev.lines;
  const lines = {};
  if (ev.pv && ev.pv.length) lines[1] = {ev:{cp:ev.cp, mate:ev.mate}, pv:ev.pv.slice()};
  else if (ev.best) lines[1] = {ev:{cp:ev.cp, mate:ev.mate}, pv:[ev.best]};
  if (ev.second) lines[2] = {ev:{...ev.second}, pv:[]};
  return Object.keys(lines).length ? lines : null;
}
function packResult(r){
  const l1 = r.lines[1] || {ev:{cp:0, mate:null}, pv:[]};
  const ev = {cp:l1.ev.cp, mate:l1.ev.mate, best: r.best && r.best !== '(none)' ? r.best : (l1.pv[0] || null), pv:(l1.pv||[]).slice(0,12)};
  if (r.lines[2]) ev.second = {cp:r.lines[2].ev.cp, mate:r.lines[2].ev.mate};
  ev.lines = {};
  for (const k of [1,2,3]) if (r.lines[k]) ev.lines[k] = {ev:{cp:r.lines[k].ev.cp, mate:r.lines[k].ev.mate}, pv:(r.lines[k].pv||[]).slice(0,12)};
  return ev;
}
function evShort(ev){

  const v = ev.cp / 100;
  return (v >= 0 ? '+' : '') + v.toFixed(1);
}
function gameOver(fen){ try { return new Chess(fen).game_over(); } catch(e){ return true; } }
function invalidateExplore(){

function ensureExplore(){

    anchor: S.ply, moves: [], fens: [S.game.fens[S.ply]], evals: [ev], idx: 0,
    vsEngine: $('optVsEngine').checked, userColor: null, lines: linesOf(ev), busy: false, pendingEngine: false,

const PZ_KEY = 'cr-pz';

  S.sel = null; S.promo = null; hideGhost();

  const cur = pzRec(P.date, P.puzzle.id);
  pzWrite(P.date, P.puzzle.id, {status: 'solved', hint: Math.max(P.hintUsed, (cur && cur.hint) || 0)});
  renderBoard(); renderPuzzle(); renderPlayers();
}
function onHint(){
  if (!P.puzzle || P.phase !== 'user' || P.busy) return;
  P.hint = Math.min(2, P.hint + 1);
  P.hintUsed = Math.max(P.hintUsed, P.hint);
  const cur = pzRec(P.date, P.puzzle.id) || {};
  pzWrite(P.date, P.puzzle.id, {status: cur.status || null, hint: P.hintUsed});
  renderBoard(); renderPuzzle();
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function showSolution(){
  if (!P.puzzle || P.phase === 'show' || P.busy) return;
  const cur = pzRec(P.date, P.puzzle.id) || {};
  const already = P.phase === 'solved' || cur.status === 'solved';
  if (!already) pzWrite(P.date, P.puzzle.id, {status: 'failed', hint: Math.max(P.hintUsed, cur.hint || 0)});
  const token = ++P.token;
  pzFlash++;
  P.busy = true;
  P.phase = 'show';
  P.hint = 0;
  P.bad = null;
  P.feedback = '';
  P.note = '';
  P.fen = P.startFen;
  P.lastMove = P.startLast;
  P.step = 0;
  S.sel = null; S.promo = null; hideGhost();
  renderBoard(); renderPuzzle();
  for (let i = 0; i < P.puzzle.solution.length; i++) {
    await sleep(480);
    if (token !== P.token) return;
    if (!applyUci(P.puzzle.solution[i])) break;
    P.step = i + 1;
    renderBoard();
  }
  if (token !== P.token) return;
  P.busy = false;
  P.phase = already ? 'solved' : 'failed';
  P.feedback = P.phase;
  renderBoard(); renderPuzzle(); renderPlayers();
}
function retryPuzzle(){
  if (!P.puzzle) return;
  P.token++;
  pzFlash++;
  resetLine();
  S.sel = null; S.promo = null; hideGhost();
  renderBoard(); renderPuzzle();
}
function openPuzzle(p){
  P.token++;
  pzFlash++;
  P.puzzle = p;
  P.view = 'play';
  P.startFen = p.fen;
  P.fen = p.fen;
  P.startLast = p.lastMove ? {from: p.lastMove.slice(0, 2), to: p.lastMove.slice(2, 4)} : null;
  P.lastMove = P.startLast;
  P.step = 0;
  P.phase = 'user';
  P.feedback = '';
  P.note = '';
  P.hint = 0;
  P.bad = null;
  P.busy = false;
  P.hintUsed = (pzRec(P.date, p.id) || {}).hint || 0;
  P.flipped = new Chess(p.fen).turn() === 'b';
  S.sel = null; S.promo = null; hideGhost();
  renderAll();
}
function hintLine(){
  if (P.phase !== 'user' || !P.hint || !P.puzzle) return '';
  const theme = P.puzzle.themes && P.puzzle.themes[0] ? prettyTheme(P.puzzle.themes[0]) : '';
  if (P.hint === 1) return `Hint: move the highlighted piece.${theme ? ' Theme: ' + theme + '.' : ''}`;
  return 'Hint: the green arrow shows the destination square.';
}
function listHtml(){
  const buttons = ['easy','medium','hard'].map(id => `<button type="button" class="btn${P.level===id?' on':''}" data-level="${id}">${levelName(id)}</button>`).join('');
  const cards = (P.set[P.level] || []).map((p, i) => {
    const rec = pzRec(P.date, p.id) || {};
    const st = rec.status === 'solved' ? 'Solved' : rec.status === 'failed' ? 'Revealed' : rec.hint ? 'Hint used' : 'New';
    const cls = rec.status === 'solved' ? 'solved' : rec.status === 'failed' ? 'failed' : '';
    const extra = rec.status === 'solved' ? `<div class="muted small">${p.rating} · ${esc((p.themes||[]).map(prettyTheme).join(', ') || 'Tactics')}</div>` : '';
    return `<div class="pzcard" data-pid="${esc(p.id)}"><div><b>${levelName(P.level)} ${i+1}</b>${extra}</div><div class="st ${cls}">${st}</div></div>`;
  }).join('');
  return `<div class="levels">${buttons}</div><div class="games">${cards}</div><div class="muted small">From the Lichess puzzle database (CC0). Easy is under 1300, Medium 1300–1800, Hard over 1800. Two of each, every day.</div>`;
}
function playHtml(){
  const p = P.puzzle;
  const rec = pzRec(P.date, p.id) || {};
  const you = new Chess(p.fen).turn() === 'w' ? 'White' : 'Black';
  let msg = '', cls = '';
  if (P.phase === 'show') msg = 'Playing the solution…';
  else if (P.phase === 'reply') { msg = 'Correct.'; cls = 'good'; }
  else if (P.feedback === 'wrong') { msg = 'Not quite. Try a different move.'; cls = 'bad'; }
  else if (P.phase === 'solved') { msg = 'Solved.'; cls = 'good'; }
  else if (P.phase === 'failed') { msg = 'Solution revealed.'; cls = 'bad'; }
  else if (rec.status === 'solved' && !P.note) msg = 'Solved already. Play it again, or show the solution.';
  else msg = P.note || `Your turn — you play ${you}.`;
  const showMeta = P.phase === 'solved' || P.phase === 'failed' || rec.status === 'solved' || rec.status === 'failed';
  const themes = (p.themes || []).map(prettyTheme);
  const meta = showMeta ? `<div class="pzmeta">${p.rating} · ${esc(themes.length ? themes.join(' · ') : 'Tactics')}</div>` : '';
  const line = (P.phase === 'solved' || P.phase === 'failed') ? `<div class="line">Solution: <span class="mv">${esc(solutionSan(p))}</span></div>` : '';
  const tip = hintLine();
  return `<button type="button" class="btn" id="pzBack">← All puzzles</button>
    <div class="pzstat ${cls}">${esc(msg)}${meta}${line}${tip ? `<div class="line">${esc(tip)}</div>` : ''}</div>
    <div class="row">
      <button type="button" class="btn" id="pzHint" ${P.phase!=='user'||P.busy||P.hint>=2?'disabled':''}>${P.hint===1?'Show square':'Hint'}</button>
      <button type="button" class="btn" id="pzSol" ${P.phase==='show'||P.busy?'disabled':''}>Solution</button>
      <button type="button" class="btn" id="pzRetry">Retry</button>
    </div>
    <div class="muted small">${esc(levelName(p.level))} · Lichess ${esc(p.id)}</div>`;
}
function bindPuzzle(){
  document.querySelectorAll('#puzzleBody [data-level]').forEach(b => { b.onclick = () => { P.level = b.dataset.level; P.view = 'list'; renderPuzzle(); }; });
  document.querySelectorAll('#puzzleBody [data-pid]').forEach(b => { b.onclick = () => { const p = todayList().find(x => x.id === b.dataset.pid); if (p) openPuzzle(p); }; });
  const back = $('pzBack'); if (back) back.onclick = () => {
    P.token++; pzFlash++;
    if (P.busy) resetLine();
    P.view = 'list';
    S.sel = null; S.promo = null; hideGhost();
    renderBoard(); renderPuzzle();
  };
  const hint = $('pzHint'); if (hint) hint.onclick = onHint;
  const sol = $('pzSol'); if (sol) sol.onclick = () => { showSolution(); };
  const retry = $('pzRetry'); if (retry) retry.onclick = retryPuzzle;
}
function renderPuzzle(){
  const el = $('puzzleBody'); if (!el) return;
  if (P.err) { el.innerHTML = `<div class="err">${esc(P.err)}</div>`; el.dataset.ids = ''; return; }
  if (!P.db || !P.set) { el.innerHTML = '<div class="muted">Loading puzzles…</div>'; el.dataset.ids = ''; return; }
  const solved = todayList().filter(p => (pzRec(P.date, p.id) || {}).status === 'solved').length;
  const head = `<div class="pzhead"><div class="pzdate">${esc(fmtDate(P.date))} <span class="muted small">UTC</span></div><div class="muted small">Same puzzles until 00:00 UTC, then a new set.</div><div class="pzstats"><span class="pzchip">${solved}/6 solved</span><span class="pzchip">Streak ${streak()}</span></div></div>`;
  el.innerHTML = head + (P.view === 'play' && P.puzzle ? playHtml() : listHtml());
  el.dataset.ids = todayList().map(p => p.id).join(',');
  el.dataset.date = P.date;
  bindPuzzle();
}
async function ensurePuzzles(){
  if (!P.db) {
    if (!pzLoading) pzLoading = fetch('puzzles.json').then(r => { if (!r.ok) throw new Error('Could not load puzzles (' + r.status + ')'); return r.json(); }).then(db => { P.db = db; P.err = ''; }).catch(e => { P.err = e.message || 'Could not load puzzles.'; });
    await pzLoading;
  }
  if (P.err || !P.db) { if (S.mode === 'puzzles') renderPuzzle(); return; }
  const date = new Date().toISOString().slice(0, 10);
  if (P.date !== date || !P.set) {
    P.date = date;
    P.set = {};
    for (const level of ['easy','medium','hard']) P.set[level] = pickN(P.db.buckets[level] || [], 2, hashStr(date + ':' + level)).map(p => Object.assign({level}, p));
  }
  if (S.mode === 'puzzles') renderPuzzle();
}
function setMode(mode){
  if (S.mode === mode) return;
  P.token++;
  pzFlash++;
  if (P.busy && P.puzzle) resetLine();
  S.sel = null; S.promo = null; hideGhost();
  S.mode = mode;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('sideReview').classList.toggle('hidden', mode !== 'review');
  $('sidePuzzle').classList.toggle('hidden', mode !== 'puzzles');
  $('reviewSettings').classList.toggle('hidden', mode === 'puzzles');
  $('headSub').textContent = mode === 'puzzles' ? 'Lichess puzzles · a new set every day' : 'Chess.com games · Stockfish 18 in your browser';
  if (mode === 'puzzles') ensurePuzzles();
  renderAll();
}
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

/* init */
(function(){
  const u = new URLSearchParams(location.search).get('user') || localStorage.getItem('cr-user') || 'LucasMazza';
  $('username').value = u;
  const d = localStorage.getItem('cr-depth'); if (d) $('depth').value = d;
  renderAll();
  loadUser();
  loadBook();
  ensurePuzzles();
  engine.init().catch(e => console.warn('engine preload failed', e));
})();
</script>
